name: Backup do banco de dados

on:
  schedule:
    # Toda segunda-feira às 07:00 UTC (04:00 horário de Brasília)
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente Postgres 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 || sudo apt-get install -y postgresql-client

      - name: Rodar pg_dump
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL_BACKUP }}
        run: |
          DATA=$(date +%Y%m%d)
          pg_dump --format=custom --no-owner --no-privileges --file="backup-$DATA.backup" "$DATABASE_URL"
          echo "BACKUP_NAME=backup-$DATA.backup" >> "$GITHUB_ENV"

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}
          retention-days: 90
